<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellar Executive Dash</title>
    <style>
        :root {
            --panel-bg: rgba(13, 20, 35, 0.85);
            --accent-gold: #f9e17d;
            --text-main: #e0e0e0;
        }

        body {
            background: #050a15;
            /* 背景にイラストを設定（URLはあなたのGitHub上のパスや画像URLに差し替え可能） */
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* メインの大型操作パネル */
        .main-container {
            width: 92vw;
            height: 90vh;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(249, 225, 125, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* 上部：時計・相場エリア */
        .header-section {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(249, 225, 125, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .clock-box { display: flex; align-items: center; gap: 15px; }
        .analog-clock {
            width: 80px; height: 80px;
            background: radial-gradient(circle, #fff 0%, #dcdcdc 100%);
            border-radius: 50%;
            border: 3px solid #bf953f;
            position: relative;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #333; }
        .hour { width: 4px; height: 25px; margin-left: -2px; }
        .minute { width: 2px; height: 35px; margin-left: -1px; }
        .second { width: 1px; height: 38px; background: red; }

        .digital-info { text-align: left; }
        #time-digit { font-size: 2.2rem; font-weight: bold; color: var(--accent-gold); margin: 0; }
        #date-digit { font-size: 0.9rem; opacity: 0.8; }

        .market-info { display: flex; gap: 20px; font-size: 0.9rem; }
        .market-item { text-align: right; }
        .val { display: block; color: var(--accent-gold); font-weight: bold; font-size: 1.1rem; }

        /* 中部：検索エリア */
        .search-bar {
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.2);
        }
        .input-group { flex: 1; display: flex; gap: 8px; }
        input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid #555;
            border-radius: 5px;
            color: #fff;
            padding: 8px 12px;
            font-size: 1rem;
        }
        button {
            background: linear-gradient(to bottom, #bf953f, #8a6e2f);
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 下部：カレンダー・スケジュール */
        .content-section {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }
        .cal-box { flex: 1.2; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; }
        .note-box { flex: 1; display: flex; flex-direction: column; }
        
        #calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .d-cell { padding: 12px 0; font-size: 1.1rem; border-radius: 5px; cursor: pointer; }
        .sun { color: #ff7675; } .sat { color: #74b9ff; }
        .today { background: var(--accent-gold); color: #000; font-weight: bold; }

        textarea {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(249, 225, 125, 0.2);
            border-radius: 10px;
            color: #f4e4bc;
            padding: 15px;
            font-size: 1.2rem;
            resize: none;
            outline: none;
        }

        @media (max-width: 800px) {
            .main-container { height: 95vh; width: 95vw; }
            .content-section { flex-direction: column; overflow-y: auto; }
            .header-section { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body onload="startApp()">

<div class="main-container">
    <div class="header-section">
        <div class="clock-box">
            <div class="analog-clock">
                <div class="hand hour" id="h-ptr"></div>
                <div class="hand minute" id="m-ptr"></div>
                <div class="hand second" id="s-ptr"></div>
            </div>
            <div class="digital-info">
                <p id="time-digit">00:00</p>
                <p id="date-digit">2026.02.11 Wed</p>
            </div>
        </div>
        <div class="market-info">
            <div class="market-item">USD/JPY <span class="val" id="rate-usd">---.--</span></div>
            <div class="market-item">BTC/JPY <span class="val" id="rate-btc">--,---</span></div>
            <div class="market-item"><span id="loc-label">東京</span> <span class="val" id="weather-val">--°C</span></div>
        </div>
    </div>

    <div class="search-bar">
        <div class="input-group">
            <input type="text" id="in-city" placeholder="市町村名で天気設定">
            <button onclick="updateCity()">設定</button>
        </div>
        <div class="input-group">
            <input type="text" id="in-stock" placeholder="銘柄検索">
            <button onclick="goStock()">株価</button>
        </div>
    </div>

    <div class="content-section">
        <div class="cal-box">
            <div id="calendar-grid"></div>
        </div>
        <div class="note-box">
            <textarea id="main-note" placeholder="本日の予定を記入..."></textarea>
        </div>
    </div>
</div>

<script>
    function startApp() {
        tick();
        setInterval(tick, 1000);
        fetchFinance();
        setInterval(fetchFinance, 60000);
        loadWeather(35.68, 139.69);
        drawCal();
    }

    function tick() {
        const n = new Date();
        document.getElementById('s-ptr').style.transform = `rotate(${(n.getSeconds()/60)*360}deg)`;
        document.getElementById('m-ptr').style.transform = `rotate(${(n.getMinutes()/60)*360}deg)`;
        document.getElementById('h-ptr').style.transform = `rotate(${(n.getHours()%12/12)*360 + (n.getMinutes()/60)*30}deg)`;
        
        document.getElementById('time-digit').innerText = n.toTimeString().split(' ')[0].substring(0,5);
        document.getElementById('date-digit').innerText = n.toLocaleDateString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short' });
    }

    async function fetchFinance() {
        try {
            const u = await fetch('https://open.er-api.com/v6/latest/USD');
            const ud = await u.json();
            document.getElementById('rate-usd').innerText = ud.rates.JPY.toFixed(2);

            const b = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=jpy');
            const bd = await b.json();
            document.getElementById('rate-btc').innerText = '¥' + bd.bitcoin.jpy.toLocaleString();
        } catch(e) {}
    }

    async function updateCity() {
        const c = document.getElementById('in-city').value;
        if(!c) return;
        const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1&language=ja`);
        const d = await r.json();
        if(d.results) {
            document.getElementById('loc-label').innerText = d.results[0].name;
            loadWeather(d.results[0].latitude, d.results[0].longitude);
        }
    }

    async function loadWeather(lat, lon) {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const d = await r.json();
        document.getElementById('weather-val').innerText = d.current_weather.temperature + '°C';
    }

    function goStock() {
        const q = document.getElementById('in-stock').value;
        if(q) window.open(`https://www.google.com/search?q=株価+${encodeURIComponent(q)}`);
    }

    function drawCal() {
        const g = document.getElementById('calendar-grid');
        const n = new Date();
        const last = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate();
        g.innerHTML = '';
        ['日','月','火','水','木','金','土'].forEach((w,i) => {
            const e = document.createElement('div');
            e.className = 'd-cell ' + (i===0?'sun':i===6?'sat':'');
            e.innerText = w; e.style.fontSize = '0.7rem';
            g.appendChild(e);
        });
        const first = new Date(n.getFullYear(), n.getMonth(), 1).getDay();
        for(let i=0; i<first; i++) g.appendChild(document.createElement('div'));
        for(let i=1; i<=last; i++) {
            const e = document.createElement('div');
            e.className = 'd-cell';
            const dow = new Date(n.getFullYear(), n.getMonth(), i).getDay();
            if(dow===0) e.classList.add('sun');
            if(dow===6) e.classList.add('sat');
            if(i===n.getDate()) e.classList.add('today');
            e.innerText = i;
            g.appendChild(e);
        }
    }
</script>
</body>
</html>
