<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellar Ultimate Executive Dash</title>
    <style>
        :root {
            --panel-bg: rgba(5, 10, 20, 0.15); 
            --accent-gold: #f9e17d;
            --text-main: #ffffff;
            --select-blue: rgba(116, 185, 255, 0.6);
        }

        body {
            background: #050a15;
            background-image: url('background.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-main); font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }

        .main-container {
            width: 96vw; height: 94vh;
            background: var(--panel-bg); backdrop-filter: blur(8px);
            border: 1px solid rgba(249, 225, 125, 0.4); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- Header --- */
        .header-section {
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(249, 225, 125, 0.2); background: rgba(255, 255, 255, 0.05);
        }
        .clock-box { display: flex; align-items: center; gap: 10px; }
        .analog-clock { width: 60px; height: 60px; background: #eee; border-radius: 50%; border: 2px solid #bf953f; position: relative; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #333; }
        .hour { width: 3px; height: 18px; margin-left: -1.5px; }
        .minute { width: 2px; height: 25px; margin-left: -1px; }
        .second { width: 1px; height: 28px; background: red; }
        #time-digit { font-size: 1.8rem; font-weight: bold; color: var(--accent-gold); margin: 0; }

        .market-info { display: flex; gap: 15px; font-size: 0.8rem; text-align: right; }

        /* --- Search Bar --- */
        .search-bar { padding: 10px 20px; display: flex; gap: 10px; background: rgba(0,0,0,0.3); }
        input, select { background: rgba(0,0,0,0.5); border: 1px solid #8a6e2f; color: #fff; border-radius: 5px; padding: 5px; }

        /* --- Main Layout --- */
        .content-section { flex: 1; display: flex; padding: 15px; gap: 15px; overflow: hidden; }
        
        .left-col { flex: 1.5; display: flex; flex-direction: column; gap: 10px; }
        
        /* ショートカットエリア */
        .shortcut-card {
            background: rgba(255,255,255,0.08); border: 1px solid var(--accent-gold); border-radius: 10px; padding: 15px;
        }
        .shortcut-title { color: var(--accent-gold); font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        .jump-btn {
            flex: 1; border: none; padding: 10px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: bold; color: #fff; transition: 0.3s;
        }
        .yahoo-btn { background: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        .gemini-btn { background: #4285f4; box-shadow: 0 0 10px rgba(66,133,244,0.3); }
        .jump-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .cal-box { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; flex: 1; }
        #calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .d-cell { padding: 8px 0; font-size: 0.9rem; border-radius: 5px; cursor: pointer; }
        .selected-day { background: var(--select-blue) !important; }
        .today { border: 1px solid var(--accent-gold); }

        .right-col { flex: 1.2; display: flex; flex-direction: column; gap: 10px; }
        
        .calc-box {
            background: rgba(0,0,0,0.4); border-radius: 10px; padding: 10px;
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
        }
        #calc-display { grid-column: span 4; background: #000; color: var(--accent-gold); text-align: right; padding: 10px; font-size: 1.2rem; border-radius: 5px; margin-bottom: 5px; height: 1.5rem; }
        .calc-btn { background: linear-gradient(#444, #222); border: 1px solid #666; color: #fff; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .calc-btn.op { background: linear-gradient(#bf953f, #8a6e2f); }

        .note-box { flex: 1; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .plan-row { display: flex; gap: 5px; }
        .plan-text { flex: 1; }
    </style>
</head>
<body onload="startApp()">

<div class="main-container">
    <div class="header-section">
        <div class="clock-box">
            <div class="analog-clock">
                <div id="h-ptr" class="hand hour"></div>
                <div id="m-ptr" class="hand minute"></div>
                <div id="s-ptr" class="hand second"></div>
            </div>
            <div>
                <p id="time-digit">--:--</p>
                <p id="date-digit" style="font-size:0.8rem; margin:0;">----/--/--</p>
            </div>
        </div>
        <div class="market-info">
            <div>USD/JPY <span id="rate-usd" style="color:var(--accent-gold)">---.--</span></div>
            <div>BTC/JPY <span id="rate-btc" style="color:var(--accent-gold)">---</span></div>
            <div><span id="loc-label">多治見</span> <span id="weather-val" style="color:var(--accent-gold)">--°C</span></div>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="in-city" placeholder="都市名" style="width:100px;">
        <button onclick="updateCity()">天気設定</button>
        <input type="text" id="in-stock" placeholder="銘柄検索" style="flex:1;">
        <button onclick="goStock()">株価検索</button>
    </div>

    <div class="content-section">
        <div class="left-col">
            <div class="shortcut-card">
                <div class="shortcut-title">QUICK ACCESS</div>
                <div class="btn-group">
                    <button class="jump-btn yahoo-btn" onclick="openYahooTransit()">Yahoo! 路線 (新守山→小泉)</button>
                    <button class="jump-btn gemini-btn" onclick="openGemini()">Google Gemini</button>
                </div>
            </div>
            <div class="cal-box">
                <div id="calendar-grid"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="calc-box">
                <div id="calc-display">0</div>
                <button class="calc-btn" onclick="calcInput('7')">7</button>
                <button class="calc-btn" onclick="calcInput('8')">8</button>
                <button class="calc-btn" onclick="calcInput('9')">9</button>
                <button class="calc-btn op" onclick="calcInput('/')">÷</button>
                <button class="calc-btn" onclick="calcInput('4')">4</button>
                <button class="calc-btn" onclick="calcInput('5')">5</button>
                <button class="calc-btn" onclick="calcInput('6')">6</button>
                <button class="calc-btn op" onclick="calcInput('*')">×</button>
                <button class="calc-btn" onclick="calcInput('1')">1</button>
                <button class="calc-btn" onclick="calcInput('2')">2</button>
                <button class="calc-btn" onclick="calcInput('3')">3</button>
                <button class="calc-btn op" onclick="calcInput('-')">-</button>
                <button class="calc-btn" onclick="calcInput('0')">0</button>
                <button class="calc-btn" onclick="calcClear()">C</button>
                <button class="calc-btn op" onclick="calcSolve()">=</button>
                <button class="calc-btn op" onclick="calcInput('+')">+</button>
            </div>

            <div class="note-box">
                <div style="font-size:0.9rem; color:var(--accent-gold); font-weight:bold;"><span id="sel-date">日付選択</span> の予定</div>
                <div class="plan-row"><select id="h1" onchange="savePlans()"></select>:<select id="m1" onchange="savePlans()"></select><input type="text" id="p1" class="plan-text" placeholder="予定1" oninput="savePlans()"></div>
                <div class="plan-row"><select id="h2" onchange="savePlans()"></select>:<select id="m2" onchange="savePlans()"></select><input type="text" id="p2" class="plan-text" placeholder="予定2" oninput="savePlans()"></div>
                <div class="plan-row"><select id="h3" onchange="savePlans()"></select>:<select id="m3" onchange="savePlans()"></select><input type="text" id="p3" class="plan-text" placeholder="予定3" oninput="savePlans()"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentYMD = "";
    let calcBuffer = "";

    function startApp() {
        initTimeDropdowns();
        tick(); setInterval(tick, 1000);
        fetchFinance(); setInterval(fetchFinance, 60000);
        const now = new Date();
        currentYMD = formatDate(now);
        drawCal(); selectDay(currentYMD);
        loadWeather(35.33, 137.12);
    }

    // ショートカット機能
    function openYahooTransit() {
        window.open("https://transit.yahoo.co.jp/search/result?from=%E6%96%B0%E5%AE%88%E5%B1%B1&to=%E5%B0%8F%E6%B3%89(%E5%B2%90%E9%98%9C%E7%9C%8C)&type=1", '_blank');
    }
    function openGemini() {
        window.open("https://gemini.google.com/", '_blank');
    }

    // --- 計算機機能 ---
    function calcInput(v) { calcBuffer += v; document.getElementById('calc-display').innerText = calcBuffer; }
    function calcClear() { calcBuffer = ""; document.getElementById('calc-display').innerText = "0"; }
    function calcSolve() { try { calcBuffer = eval(calcBuffer).toString(); document.getElementById('calc-display').innerText = calcBuffer; } catch(e) { calcClear(); } }

    // --- 基本ロジック ---
    function initTimeDropdowns() {
        for(let i=1; i<=3; i++) {
            const hSel = document.getElementById('h'+i); const mSel = document.getElementById('m'+i);
            hSel.innerHTML = '<option value="">時</option>'; mSel.innerHTML = '<option value="">分</option>';
            for(let h=0; h<24; h++) hSel.innerHTML += `<option value="${h}">${h}</option>`;
            for(let m=0; m<60; m+=5) mSel.innerHTML += `<option value="${String(m).padStart(2,'0')}">${String(m).padStart(2,'0')}</option>`;
        }
    }

    function tick() {
        const n = new Date();
        document.getElementById('s-ptr').style.transform = `rotate(${(n.getSeconds()/60)*360}deg)`;
        document.getElementById('m-ptr').style.transform = `rotate(${(n.getMinutes()/60)*360}deg)`;
        document.getElementById('h-ptr').style.transform = `rotate(${(n.getHours()%12/12)*360 + (n.getMinutes()/60)*30}deg)`;
        document.getElementById('time-digit').innerText = n.toTimeString().split(' ')[0].substring(0,5);
        document.getElementById('date-digit').innerText = n.toLocaleDateString();
    }

    async function fetchFinance() {
        try {
            const u = await fetch('https://open.er-api.com/v6/latest/USD');
            const ud = await u.json();
            document.getElementById('rate-usd').innerText = ud.rates.JPY.toFixed(2);
            const b = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
            const bd = await b.json();
            document.getElementById('rate-btc').innerText = '¥' + Math.floor(parseFloat(bd.price) * ud.rates.JPY).toLocaleString();
        } catch(e) {}
    }

    async function updateCity() {
        const c = document.getElementById('in-city').value;
        const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1&language=ja`);
        const d = await r.json();
        if(d.results) {
            document.getElementById('loc-label').innerText = d.results[0].name;
            loadWeather(d.results[0].latitude, d.results[0].longitude);
        }
    }

    async function loadWeather(lat, lon) {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const d = await r.json();
        document.getElementById('weather-val').innerText = d.current_weather.temperature + '°C';
    }

    function selectDay(ymd) {
        currentYMD = ymd; document.getElementById('sel-date').innerText = ymd;
        document.querySelectorAll('.d-cell').forEach(el => {
            el.classList.remove('selected-day'); if(el.getAttribute('data-ymd') === ymd) el.classList.add('selected-day');
        });
        loadPlans(ymd);
    }

    function savePlans() {
        const data = {
            h1: document.getElementById('h1').value, m1: document.getElementById('m1').value, p1: document.getElementById('p1').value,
            h2: document.getElementById('h2').value, m2: document.getElementById('m2').value, p2: document.getElementById('p2').value,
            h3: document.getElementById('h3').value, m3: document.getElementById('m3').value, p3: document.getElementById('p3').value
        };
        localStorage.setItem('plans_' + currentYMD, JSON.stringify(data));
    }

    function loadPlans(ymd) {
        const s = localStorage.getItem('plans_' + ymd); const d = s ? JSON.parse(s) : {};
        for(let i=1; i<=3; i++) {
            document.getElementById('h'+i).value = d['h'+i] || "";
            document.getElementById('m'+i).value = d['m'+i] || "";
            document.getElementById('p'+i).value = d['p'+i] || "";
        }
    }

    function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

    function drawCal() {
        const g = document.getElementById('calendar-grid'); const n = new Date();
        const y = n.getFullYear(); const m = n.getMonth();
        const last = new Date(y, m+1, 0).getDate(); const first = new Date(y, m, 1).getDay();
        g.innerHTML = '';
        ['日','月','火','水','木','金','土'].forEach(w => {
            const e = document.createElement('div'); e.innerText = w; e.style.fontSize = '0.7rem'; g.appendChild(e);
        });
        for(let i=0; i<first; i++) g.appendChild(document.createElement('div'));
        for(let i=1; i<=last; i++) {
            const e = document.createElement('div'); const ymd = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            e.className = 'd-cell'; e.setAttribute('data-ymd', ymd);
            if(ymd === formatDate(n)) e.classList.add('today');
            e.innerText = i; e.onclick = () => selectDay(ymd);
            g.appendChild(e);
        }
    }
    function goStock() { const q = document.getElementById('in-stock').value; if(q) window.open(`https://www.google.com/search?q=株価+${encodeURIComponent(q)}`); }
</script>
</body>
</html>
