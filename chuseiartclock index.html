<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Museum Market & Weather</title>
    <style>
        :root {
            --gold: linear-gradient(145deg, #f9e17d, #bf953f, #8a6e2f, #bf953f, #f9e17d);
            --marble: radial-gradient(circle at center, #ffffff 0%, #dcdcdc 70%, #c0c0c0 100%);
            --bg-dark: #0a0805;
        }

        body {
            background: var(--bg-dark);
            color: #d4b483;
            font-family: 'Georgia', 'Hiragino Mincho ProN', serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- 上部：コックピットセクション --- */
        .top-section {
            flex: none;
            height: 42vh;
            display: flex;
            background: radial-gradient(circle at 0% 50%, #2a1b0a 0%, #0a0805 100%);
            border-bottom: 3px double #5c441a;
            padding: 10px;
            box-sizing: border-box;
        }

        .museum-frame {
            position: relative;
            width: 110px;
            height: 110px;
            padding: 8px;
            background: var(--gold);
            border-radius: 50%;
            align-self: center;
        }

        .clock-face {
            width: 100%; height: 100%;
            background: var(--marble);
            border-radius: 50%;
            border: 4px solid #2a1b0a;
            position: relative;
        }

        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #1a120b; }
        .hour { width: 4px; height: 30px; margin-left: -2px; }
        .minute { width: 3px; height: 40px; margin-left: -1.5px; }
        .second { width: 1px; height: 45px; margin-left: -0.5px; background: #a52a2a; }

        .info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        #digital-clock { font-size: 1.5rem; font-weight: bold; color: #f9e17d; }
        #digital-date { font-size: 0.8rem; opacity: 0.7; }

        .market-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 5px;
        }

        .data-row {
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(212, 180, 131, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }

        .search-box {
            display: flex;
            gap: 4px;
            width: 100%;
            justify-content: flex-end;
            margin-top: 2px;
        }

        input {
            background: #1a120b;
            border: 1px solid #5c441a;
            color: #f9e17d;
            font-size: 0.7rem;
            padding: 3px;
            border-radius: 3px;
        }

        .small-btn {
            background: #5c441a;
            color: #f4e4bc;
            border: none;
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 3px;
            cursor: pointer;
        }

        /* --- 下部：カレンダー --- */
        .schedule-section {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            background: #0f0a05;
        }

        .calendar-card {
            background: rgba(42, 27, 10, 0.4);
            border: 1px solid #5c441a;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center; }
        .day { padding: 10px 0; font-size: 0.9rem; cursor: pointer; }
        .sun { color: #ff6b6b; } 
        .sat { color: #6ba6ff; }
        .today { background: #8a6e2f; color: white; border-radius: 4px; }

        #note-area {
            flex: 1;
            background: #1a120b;
            color: #f4e4bc;
            border: 1px solid #3d2b1f;
            padding: 12px;
            font-size: 1rem;
            border-radius: 5px;
            outline: none;
        }
    </style>
</head>
<body>

<div class="top-section">
    <div class="museum-frame">
        <div class="clock-face">
            <div class="hand hour" id="hour"></div>
            <div class="hand minute" id="minute"></div>
            <div class="hand second" id="second"></div>
        </div>
    </div>

    <div class="info-panel">
        <div id="digital-clock">00:00</div>
        <div id="digital-date">2026.02.11</div>
        
        <div class="market-panel">
            <div class="data-row"><span>USD/JPY</span><span id="usd-jpy">---.--</span></div>
            <div class="data-row"><span>BTC/JPY</span><span id="btc-jpy">---,---</span></div>
            <div class="data-row">
                <span id="location-name" style="font-size: 0.65rem; color: #aaa;">東京</span>
                <span id="weather-info">--°C</span>
            </div>
            
            <div class="search-box">
                <input type="text" id="city-input" placeholder="市町村名" style="width: 70px;">
                <button class="small-btn" onclick="searchCity()">天気設定</button>
            </div>
            <div class="search-box">
                <input type="text" id="stock-input" placeholder="銘柄/コード" style="width: 70px;">
                <button class="small-btn" onclick="searchStock()">株価検索</button>
            </div>
        </div>
    </div>
</div>

<div class="schedule-section">
    <div class="calendar-card">
        <div class="calendar-grid" id="calendar-days"></div>
    </div>
    <textarea id="note-area" placeholder="記録を記す..."></textarea>
</div>

<script>
    // 時計
    function updateClock() {
        const now = new Date();
        document.getElementById('second').style.transform = `rotate(${(now.getSeconds()/60)*360}deg)`;
        document.getElementById('minute').style.transform = `rotate(${(now.getMinutes()/60)*360}deg)`;
        document.getElementById('hour').style.transform = `rotate(${(now.getHours()%12/12)*360 + (now.getMinutes()/60)*30}deg)`;
        document.getElementById('digital-clock').innerText = now.toTimeString().split(' ')[0].substring(0,5);
        document.getElementById('digital-date').innerText = now.toLocaleDateString();
    }
    setInterval(updateClock, 1000); updateClock();
